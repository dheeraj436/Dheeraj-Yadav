# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI/CD with Kubernate on EC2

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # Checkout source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Setup Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    # Build Spring Boot Project
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # Upload JAR Artifact
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: springboot-jar
        path: target/*.jar

    # Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build and Push Docker Image
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: drjydv436/springsecurityandjwt:latest

    # Deploy to Kubernetes on EC2
    - name: Deploy to Kubernetes
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Update kubeconfig if needed
          export KUBECONFIG=$HOME/.kube/config
    
          # Pull latest image on cluster nodes
          docker pull drjydv436/springsecurityandjwt:latest || true
    
          # Update deployment image
          kubectl set image deployment/springboot-deployment \
          springboot-container=drjydv436/springsecurityandjwt:latest
    
          # Restart deployment
          kubectl rollout restart deployment springboot-deployment
    
          # Wait for rollout
          kubectl rollout status deployment/springboot-deployment
    
          # Verify pods
          kubectl get pods
    
          # Verify service
          kubectl get svc
